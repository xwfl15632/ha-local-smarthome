echo_say_fast:
  alias: Echo Say Fast (单次合成渐进流)
  mode: restart
  fields:
    message:
      description: 播报文本
      example: 晚上好，这里是家庭播报
  sequence:
  - variables:
      jid: ha-{{ (now().timestamp() * 1000) | int }}
      fast_players: '{% set r = states(''assist_satellite.esp32_s3_box_3_assist_satellite'')
        == ''responding'' %}media_player.homatics,media_player.shu_fang_2{{ '''' if
        r else '',media_player.ke_ting_esp32_s3_box_3_648870'' }}{{ '''' if states(''assist_satellite.01_box_chu_fang_1666ec_assist_satellite'')
        == ''responding'' else '',media_player.01_box_chu_fang_1666ec'' }}'
      fast_url: http://ANNOUNCE_PROXY_HOST:50100/play?j={{ jid }}&players={{ fast_players
        }}&key=CHANGE_ME_ANNOUNCE_API_KEY&text={{ message | urlencode }}
      box_responding: '{{ states(''assist_satellite.esp32_s3_box_3_assist_satellite'')
        == ''responding'' }}'
      kitchen_responding: '{{ states(''assist_satellite.01_box_chu_fang_1666ec_assist_satellite'')
        == ''responding'' }}'
  - target:
      entity_id: switch.esp32_s3_box_3_mute
    action: switch.turn_on
  - if: '{{ states("media_player.homatics") == "off" }}'
    then:
    - target:
        entity_id: media_player.homatics
      action: media_player.turn_on
    - wait_for_trigger:
      - trigger: state
        entity_id: media_player.homatics
        to: 'on'
      timeout: 00:00:25
      continue_on_timeout: true
    - delay: 00:00:05
    continue_on_error: true
  - repeat:
      for_each:
      - media_player.homatics
      - media_player.shu_fang_2
      sequence:
      - target:
          entity_id: '{{ repeat.item }}'
        action: media_player.clear_playlist
        continue_on_error: true
      - target:
          entity_id: '{{ repeat.item }}'
        action: media_player.media_stop
        continue_on_error: true
      - target:
          entity_id: '{{ repeat.item }}'
        data:
          media_content_type: music
          media_content_id: '{{ fast_url }}'
          enqueue: replace
        action: media_player.play_media
        continue_on_error: true
  - data:
      message: '{{ message }}'
      data:
        type: announce
    action: notify.alexa_media_echo_spot
  - if: '{{ box_responding != ''True'' }}'
