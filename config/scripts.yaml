guan_ying_mo_shi:
  alias: "\U0001F3AC 观影模式"
  mode: single
  sequence:
  - data:
      entity_id: script.dangbei_power
    action: script.turn_on
  - delay: 00:00:10
  - action: remote.send_command
    target:
      entity_id: remote.rm4_pro_ke_ting
    data:
      device: infrared
      command: dangbei_up
  - delay: 00:00:01
  - action: remote.send_command
    target:
      entity_id: remote.rm4_pro_ke_ting
    data:
      device: infrared
      command: dangbei_ok
  - delay: 00:00:02
  - action: media_player.turn_on
    target:
      entity_id: media_player.ke_ting_tv_2
    continue_on_error: true
  - repeat:
      count: 4
      sequence:
      - data:
          entity_id: switch.0xa4c138c7fba090ed
        action: switch.turn_on
      - delay: 00:00:03
  - if:
    - condition: state
      entity_id: media_player.denon_avr_x4700h
      state: 'off'
    then:
    - data:
        entity_id: script.denon_power
      action: script.turn_on
    - delay: 00:00:03
  - data:
      entity_id: media_player.denon_avr_x4700h
      source: Media Player
    action: media_player.select_source
  - action: switch.turn_on
    data:
      entity_id:
      - switch.san_lu_fu_he_kai_guan_zt_2_switch_1
      - switch.san_lu_fu_he_kai_guan_zt_2_switch_2
      - switch.san_lu_fu_he_kai_guan_zt_2_switch_3
      - switch.san_lu_fu_he_kai_guan_zt_switch_2
      - switch.san_lu_fu_he_kai_guan_zt_switch_3
  - wait_template: '{{ states(''light.huan_deng_72'') != ''unavailable'' and states(''light.huan_deng_73'')
      != ''unavailable'' and states(''light.huan_deng_74'') != ''unavailable'' and
      states(''light.huan_deng_75'') != ''unavailable'' and states(''light.huan_deng_76'')
      != ''unavailable'' and states(''light.huan_deng_77'') != ''unavailable'' and
      states(''light.huan_deng_78'') != ''unavailable'' and states(''light.huan_deng_79'')
      != ''unavailable'' and states(''light.huan_deng_80'') != ''unavailable'' and
      states(''light.cha_ji_deng_86'') != ''unavailable'' and states(''light.cha_ji_deng_87'')
      != ''unavailable'' and states(''light.cha_ji_deng_88'') != ''unavailable'' and
      states(''light.can_deng_83'') != ''unavailable'' and states(''light.can_deng_84'')
      != ''unavailable'' and states(''light.can_deng_85'') != ''unavailable'' and
      states(''light.bqshuang_se_deng_dai_z5005w_10'') != ''unavailable'' and states(''light.yi_lou_guo_dao_68'')
      != ''unavailable'' and states(''light.yi_lou_guo_dao_69'') != ''unavailable''
      and states(''light.yi_lou_guo_dao_70'') != ''unavailable'' and states(''light.yi_lou_guo_dao_71'')
      != ''unavailable'' and states(''light.ba_tai_66'') != ''unavailable'' and states(''light.ba_tai_67'')
      != ''unavailable'' }}'
    timeout: 00:01:40
    continue_on_timeout: true
  - data:
      entity_id:
      - light.huan_deng_72
      - light.huan_deng_73
      - light.huan_deng_76
    action: light.turn_off
  - data:
      entity_id:
      - light.huan_deng_74
      - light.huan_deng_75
      - light.huan_deng_77
      - light.huan_deng_78
      - light.huan_deng_79
      - light.huan_deng_80
      - light.cha_ji_deng_86
      - light.cha_ji_deng_87
      - light.cha_ji_deng_88
      - light.can_deng_83
      - light.can_deng_84
      - light.can_deng_85
      - light.bqshuang_se_deng_dai_z5005w_10
      brightness_pct: 15
    action: light.turn_on
  - data:
      entity_id: switch.quan_wu_zi_gua_ying_adaptive_lighting_quan_wu_zi_gua_ying
      lights:
      - light.huan_deng_72
      - light.huan_deng_73
      - light.huan_deng_74
      - light.huan_deng_75
      - light.huan_deng_76
      - light.huan_deng_77
      - light.huan_deng_78
      - light.huan_deng_79
      - light.huan_deng_80
      - light.cha_ji_deng_86
      - light.cha_ji_deng_87
      - light.cha_ji_deng_88
      - light.can_deng_83
      - light.can_deng_84
      - light.can_deng_85
      - light.bqshuang_se_deng_dai_z5005w_10
      - light.yi_lou_guo_dao_68
      - light.yi_lou_guo_dao_69
      - light.yi_lou_guo_dao_70
      - light.yi_lou_guo_dao_71
      - light.ba_tai_66
      - light.ba_tai_67
      manual_control: true
    action: adaptive_lighting.set_manual_control
  - action: light.turn_off
    target:
      entity_id:
      - light.ba_tai_66
      - light.ba_tai_67
      - light.yi_lou_guo_dao_68
      - light.yi_lou_guo_dao_69
      - light.yi_lou_guo_dao_70
      - light.yi_lou_guo_dao_71
  - data:
      entity_id: cover.juan_lian_curtain
    action: cover.close_cover
  - data:
      entity_id: cover.ke_ting_chuang_lian
    action: cover.close_cover
