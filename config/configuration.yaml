intent_script:
  OutsideWeather:
    speech:
      text: "{{ states.weather.forecast_wo_de_jia.attributes.temperature | round(0, 'floor') }}度，{%- if states.weather.forecast_wo_de_jia.state in ('sunny','clear') %}晴{%- elif states.weather.forecast_wo_de_jia.state in ('cloudy','partlycloudy','partly_cloudy') %}多云{%- elif states.weather.forecast_wo_de_jia.state == 'rainy' %}有雨{%- elif states.weather.forecast_wo_de_jia.state == 'showers' %}有阵雨{%- elif states.weather.forecast_wo_de_jia.state in ('pouring','thunderstorms') %}大雨{%- elif states.weather.forecast_wo_de_jia.state == 'snowy' %}有雪{%- elif states.weather.forecast_wo_de_jia.state == 'hail' %}冰雹{%- elif states.weather.forecast_wo_de_jia.state == 'foggy' %}有雾{%- elif states.weather.forecast_wo_de_jia.state == 'windy' %}大风{%- else %}{{ states.weather.forecast_wo_de_jia.state }}{%- endif %}，湿度{{ states.weather.forecast_wo_de_jia.attributes.humidity }}%。"
  RoomTempHumidity:
    speech:
