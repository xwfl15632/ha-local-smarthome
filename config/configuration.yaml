mqtt:
  - binary_sensor:
      name: 一楼楼梯人体感应器 有人检测
      unique_id: 0x54ef4410013f9edb_occupancy_fix
      state_topic: zigbee2mqtt/一楼楼梯人体感应器
      value_template: "{{ value_json.occupancy }}"
      payload_on: "1"
      payload_off: "0"
      device_class: occupancy
      device:
        identifiers:
          - zigbee2mqtt_0x54ef4410013f7cf9
        name: 一楼楼梯人体感应器
        manufacturer: Aqara
        model: Motion sensor E1

