
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
# ===== 窗帘方向修正（HA 2026.8 tuya 回归 workaround，2026-08-08）=====
template:
  - cover:
      - name: "次卧窗纱"
        unique_id: rev_chuang_sha_curtain
        state: >
          {% if states('cover.chuang_sha_curtain') == 'open' %}closed
          {% else %}open{% endif %}
        open_cover:
          action: cover.close_cover
          target:
            entity_id: cover.chuang_sha_curtain
        close_cover:
          action: cover.open_cover
          target:
            entity_id: cover.chuang_sha_curtain
        stop_cover:
          action: cover.stop_cover
          target:
            entity_id: cover.chuang_sha_curtain
        set_cover_position:
          action: cover.set_cover_position
          target:
            entity_id: cover.chuang_sha_curtain
          data:
            position: "{{ 100 - position }}"
        position: >
          {% set p = state_attr('cover.chuang_sha_curtain', 'current_position') %}
          {{ (100 - p) if p is not none else none }}
