- id: tts_auto_soundmode
  alias: 播报自动切声场
  description: 任何 TTS 播报(tts.speak 或 media_player 播放 media-source://tts)开始时自动运行 script.tian_long_bo_bao
    切 MCH STEREO。仅匹配播报,音乐播放不触发。
  triggers:
  - trigger: event
    event_type: call_service
    event_data:
      domain: tts
      service: speak
  - trigger: event
    event_type: call_service
    event_data:
      domain: media_player
      service: play_media
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.service == ''speak'' or (trigger.event.data.service
      == ''play_media'' and trigger.event.data.service_data is defined and trigger.event.data.service_data.media_content_id
      is defined and ''tts'' in trigger.event.data.service_data.media_content_id)
      }}'
  actions:
  - action: script.tian_long_bo_bao
  mode: single
- id: voice_satellite_stuck_watchdog
  alias: 语音卫星卡死看门狗
  description: BOX-3 语音卫星卡在 responding/thinking 超 3 分钟（通常 TTS 出音频失败导致会话无法正常收尾）时，自动
    announce 复位并推送结果。解决 2026-08-29 16:37 卡死 8.5 小时、Okay Nabu 全部无反应的问题。
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id: assist_satellite.esp32_s3_box_3_assist_satellite
    to: responding
    for: 00:03:00
  - trigger: state
    entity_id: assist_satellite.esp32_s3_box_3_assist_satellite
    to: thinking
    for: 00:03:00
  actions:
  - action: assist_satellite.announce
    target:
      entity_id: assist_satellite.esp32_s3_box_3_assist_satellite
    data:
      message: 语音助手刚才卡住了，我已自动恢复，请再说一次 Okay Nabu
  - delay: 00:00:12
  - choose:
    - conditions:
      - condition: state
        entity_id: assist_satellite.esp32_s3_box_3_assist_satellite
        state: idle
      sequence:
      - action: notify.mobile_app_phone
        data:
          title: 语音卫星已自动恢复
          message: BOX-3 卡在 responding/thinking 超 3 分钟，看门狗 announce 复位成功，已回到 idle。可正常使用
            Okay Nabu。
    - conditions: []
      sequence:
      - action: notify.mobile_app_phone
        data:
          title: 语音卫星仍卡死（announce 复位失败）
          message: BOX-3 announce 复位后仍未回 idle，大概率 TTS 引擎故障，请手动断电重启 ESP32 Box 3，或让我介入排查。
  conditions: []
